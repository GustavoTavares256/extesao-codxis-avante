<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avante Dashboard</title>
    <style>
      body {
        width: 280px;
        padding: 14px;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .text {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.4;
      }
      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px;
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="title">Avante Web Dashboard</div>
    <div class="text">
      Painel automático para monitoramento de vendas, produtos, pedidos e progresso de meta.
    </div>

    <div class="section-label">Configurações</div>
    <label class="field">
      <span>Meta mensal</span>
      <input id="meta-monthly" type="number" min="0" step="0.01" placeholder="250000" />
    </label>

    <label class="field">
      <span>Tema</span>
      <select id="theme-mode">
        <option value="dark">Escuro</option>
        <option value="light">Claro</option>
      </select>
    </label>

    <label class="field checkbox-row">
      <input id="auto-refresh" type="checkbox" />
      <span>Atualização automática</span>
    </label>

    <div class="field">
      <span>Indicadores visíveis</span>
      <div class="checkbox-grid">
        <label><input type="checkbox" class="indicator-toggle" value="entradas" checked /> Entradas</label>
        <label><input type="checkbox" class="indicator-toggle" value="saidas" checked /> Saídas</label>
        <label><input type="checkbox" class="indicator-toggle" value="lucro" checked /> Lucro</label>
        <label><input type="checkbox" class="indicator-toggle" value="vendas" checked /> Vendas</label>
        <label><input type="checkbox" class="indicator-toggle" value="produtos" checked /> Produtos</label>
        <label><input type="checkbox" class="indicator-toggle" value="pedidos" checked /> Pedidos</label>
      </div>
    </div>

    <button id="save-settings">Salvar configurações</button>
    <button id="refresh-dashboard">Atualizar dados</button>
    <div id="refresh-status" class="text" style="margin-top: 10px; color: #f8fafc; display: none;"></div>
    <script src="popup.js"></script>
  </body>
</html>
