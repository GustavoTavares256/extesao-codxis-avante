<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avante Dashboard</title>
    <style>
      body {
        width: 280px;
        padding: 14px;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .text {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.4;
      }
      button {
        margin-top: 12px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px;
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="title">Avante Web Dashboard</div>
    <div class="text">
      Painel automático para monitoramento de vendas, produtos, pedidos e progresso de meta.
    </div>
    <button id="refresh-dashboard">Atualizar dados</button>
    <script src="popup.js"></script>
  </body>
</html>
